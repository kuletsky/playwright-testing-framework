userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: EmpowerMarketingTestAutomationFramework
buildName: DESKTOP Login, Registration, Navigation tests  -->  Windows11/Chrome, MacOS/Safari
framework: playwright

platforms:
  # - os: Windows
  #   osVersion: 11
  #   browserName: chrome
  #   browserVersion: latest

  # - browserName: chrome
  #   browserVersion: latest

  # - browserName: playwright-webkit
  #   browserVersion: latest

  # - os: OS X
  #   osVersion: Sequoia
  #   browserName: safari
  #   browserVersion: latest
  - os: OS X
    osVersion: Tahoe
    browserName: Safari
    browserVersion: 26.4
    
testOrchestrationOptions:
  retryTestsOnFailure:
    enabled: true
    maxRetries: 3

parallelsPerPlatform: 1
idleTimeout: 240
browserstackLocal: false

selfHeal: true
aiAuthoring: true

debug: true
networkLogs: false
consoleLogs: errors
testObservability: true
video: true