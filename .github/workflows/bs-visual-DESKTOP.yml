name: BS Visual DESKTOP tests

on:
  workflow_dispatch:
  schedule:
    
    # 9:00 PM America/New_York is usually 01:00 UTC (during Standard Time).
    - cron: "0 1 * * *"

jobs:
  desktop-visual:
    runs-on: ubuntu-latest

    # permissions:
    #   contents: read
    #   id-token: write
      
    env:
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "AUTH_USER=${{ secrets.AUTH_USER }}" >> .env
          echo "AUTH_PASS=${{ secrets.AUTH_PASS }}" >> .env
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env

      - name: Write BrowserStack config
        env:
          BUILD_NUMBER: ${{ github.run_number }}
  
        # run: |
        #   sed "s/\${BROWSERSTACK_USERNAME}/${{ secrets.BROWSERSTACK_USERNAME }}/g" bs-visual-DESKTOP.yml > browserstack.yml
        #   sed -i "s/\${BROWSERSTACK_ACCESS_KEY}/${{ secrets.BROWSERSTACK_ACCESS_KEY }}/g" browserstack.yml
        #   sed -i "s/\${BUILD_NUMBER}/${{ env.BUILD_NUMBER }}/g" browserstack.yml
        run: envsubst '${BUILD_NUMBER}' < bs-visual-DESKTOP.yml > browserstack.yml


      - name: Run visual spec on BrowserStack
        run: |
          npx percy exec -- npx browserstack-node-sdk playwright test visual.spec.ts

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-visual-artifacts
          path: |
            playwright-report/
            test-results/