userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

projectName: EmpowerMarketingTestAutomationFramework
buildName: MOBILE Login, Registration, Navigation tests  -->  Pixel_7/Chrome, iPhone_14/Safari
framework: playwright

platforms:
  # - device: Samsung Galaxy S23
  #   osVersion: 13
  #   browserName: chrome
  #   deviceOrientation: portrait
  #   realMobile: true

  - os: OS X
    osVersion: Ventura
    browserName: playwright-webkit
    browserVersion: latest
    playwrightConfigOptions:
      name: emu-iphone14-webkit
      use:
        deviceName: iPhone 14

  - os: Windows
    osVersion: 11   
    browserName: chrome
    browserVersion: latest
    playwrightConfigOptions:
      use:
        deviceName: Pixel 7

  # - os: "Windows"
  #   osVersion: "11"
  #   browserName: "playwright-chromium"
  #   browserVersion: "latest"
  #   playwrightConfigOptions:
  #     name: "emu-galaxy-s22-chromium"
  #     use:
  #       deviceName: "Galaxy S22"

testOrchestrationOptions:
  retryTestsOnFailure:
    enabled: true
    maxRetries: 3

parallelsPerPlatform: 1
idleTimeout: 240
browserstackLocal: false

selfHeal: true
aiAuthoring: true

debug: true
networkLogs: false
consoleLogs: errors
testObservability: true
video: true